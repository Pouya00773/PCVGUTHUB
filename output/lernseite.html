<title>Karteikarten — Grundlagen der Automation</title>
<style>
:root{
  --paper:#F2F3EF; --paper-2:#E9EBE3; --ink:#1A1D17; --ink-2:#585D4E;
  --rule:#C7CBBC; --rule-soft:#DDE0D5;
  --accent:#5C8F00; --accent-bright:#75B800; --accent-soft:#EDF3DE;
  --signal:#A8760A; --signal-soft:#FBF0D5;
  --grid:rgba(26,29,23,.045);
  --shadow:0 1px 2px rgba(26,29,23,.06),0 8px 28px rgba(26,29,23,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#12150F; --paper-2:#1A1E15; --ink:#E8EAE3; --ink-2:#9AA08D;
    --rule:#333829; --rule-soft:#262B1E;
    --accent:#93D613; --accent-bright:#A8E82B; --accent-soft:#1F2A0C;
    --signal:#E0A800; --signal-soft:#2C2408;
    --grid:rgba(232,234,227,.045);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#12150F; --paper-2:#1A1E15; --ink:#E8EAE3; --ink-2:#9AA08D;
  --rule:#333829; --rule-soft:#262B1E;
  --accent:#93D613; --accent-bright:#A8E82B; --accent-soft:#1F2A0C;
  --signal:#E0A800; --signal-soft:#2C2408;
  --grid:rgba(232,234,227,.045);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 32px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --paper:#F2F3EF; --paper-2:#E9EBE3; --ink:#1A1D17; --ink-2:#585D4E;
  --rule:#C7CBBC; --rule-soft:#DDE0D5;
  --accent:#5C8F00; --accent-bright:#75B800; --accent-soft:#EDF3DE;
  --signal:#A8760A; --signal-soft:#FBF0D5;
  --grid:rgba(26,29,23,.045);
  --shadow:0 1px 2px rgba(26,29,23,.06),0 8px 28px rgba(26,29,23,.07);
}

*{box-sizing:border-box}

body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-text-size-adjust:100%;
}

.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}

.wrap{max-width:760px;margin:0 auto;padding:20px 18px 56px;
  display:flex;flex-direction:column;gap:18px}

/* ---- Kopf ---- */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;
  padding-bottom:12px;border-bottom:2px solid var(--ink)}
h1{margin:0;font-size:1.16rem;font-weight:700;letter-spacing:-.015em;
  text-wrap:balance}
.sub{font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;
  color:var(--ink-2);margin-left:auto}

/* ---- Steuerleiste ---- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;
  overflow:hidden;background:var(--paper-2)}
.seg button{appearance:none;background:transparent;border:0;
  padding:7px 13px;font:inherit;font-size:.72rem;color:var(--ink-2);
  cursor:pointer;letter-spacing:.09em;text-transform:uppercase;
  border-right:1px solid var(--rule-soft)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}

select,.btn{appearance:none;font:inherit;font-size:.72rem;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);
  background:var(--paper-2);border:1px solid var(--rule);border-radius:2px;
  padding:7px 13px;cursor:pointer}
select{text-transform:none;letter-spacing:0;font-size:.78rem;color:var(--ink)}
.btn:hover,select:hover{color:var(--ink);border-color:var(--ink-2)}

:where(button,select,a):focus-visible{outline:2px solid var(--accent-bright);
  outline-offset:2px}

/* ---- Fortschrittsbalken ---- */
.progress{height:3px;background:var(--rule-soft);position:relative;overflow:hidden}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--accent-bright);
  transition:width .3s ease}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}

/* ---- Karte ---- */
.stage{perspective:1600px;display:flex;align-items:flex-start}
.card{width:100%;display:grid;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer;
  border:0;padding:0;background:none;font:inherit;color:inherit;text-align:left}
.card.flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper-2);border:1px solid var(--rule);
  box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:230px}
.face.back{transform:rotateY(180deg)}

.face-body{flex:1;padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px}

.tagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 8px;border:1px solid var(--rule);color:var(--ink-2);border-radius:2px}
.tag.klausur{border-color:var(--signal);color:var(--signal);
  background:var(--signal-soft);font-weight:600}
.tag.seite{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.q{font-size:1.24rem;line-height:1.35;font-weight:650;letter-spacing:-.012em;
  text-wrap:balance;margin:0}
.a{font-size:1rem;line-height:1.62;margin:0}
.a strong{font-weight:650}
code{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.9em;background:var(--accent-soft);color:var(--accent);
  padding:1px 5px;border-radius:2px}

.hint{margin-top:auto;padding-top:10px;font-size:.68rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2)}

/* Schriftfeld, wie im Stromlaufplan */
.schriftfeld{display:grid;grid-template-columns:1fr 1fr auto;
  border-top:1px solid var(--rule)}
.schriftfeld div{padding:7px 12px;border-right:1px solid var(--rule);
  font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schriftfeld div:last-child{border-right:0;font-variant-numeric:tabular-nums;
  color:var(--ink)}
.schriftfeld b{color:var(--ink);font-weight:600}

/* ---- Bewertung ---- */
.rate{display:flex;gap:8px}
.rate button{flex:1;padding:13px;font-size:.74rem;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid var(--rule);background:var(--paper-2);
  color:var(--ink-2);cursor:pointer;border-radius:2px;font-family:inherit}
.rate button:hover{color:var(--ink);border-color:var(--ink-2)}
.rate .ok:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rate .again:hover{border-color:var(--signal);color:var(--signal);background:var(--signal-soft)}

.stats{display:flex;gap:18px;font-size:.68rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}

.empty{padding:40px 24px;text-align:center;color:var(--ink-2);
  border:1px dashed var(--rule);background:var(--paper-2)}

@media (max-width:560px){
  .wrap{padding:14px 12px 40px}
  .q{font-size:1.1rem}
  .sub{margin-left:0;width:100%}
  .schriftfeld{grid-template-columns:1fr auto}
  .schriftfeld div:nth-child(2){display:none}
}
</style>
<div class="wrap">
  <header>
    <h1>Grundlagen der Automation</h1>
    <span class="sub mono">172 Karten · 68 klausurrelevant</span>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Kartenauswahl">
      <button data-f="alle" aria-pressed="true">Alle</button>
      <button data-f="klausur" aria-pressed="false">Nur Klausur</button>
      <button data-f="offen" aria-pressed="false">Offen</button>
    </div>
    <select id="kap" aria-label="Kapitel filtern">
      <option value="">Alle Kapitel</option><option value="Kapitel 5 — SPS">Kapitel 5 — SPS</option><option value="Kapitel 2 — Systeme">Kapitel 2 — Systeme</option><option value="Kapitel 2.1 — Signale">Kapitel 2.1 — Signale</option><option value="Kapitel 7 — Automaten">Kapitel 7 — Automaten</option><option value="Kapitel 1 — Grundlagen">Kapitel 1 — Grundlagen</option><option value="Kapitel 4.2 — Schaltwerke">Kapitel 4.2 — Schaltwerke</option><option value="Kapitel 3 — Digitaltechnik">Kapitel 3 — Digitaltechnik</option><option value="Kapitel 6 — Ablaufsteuerung / SFC">Kapitel 6 — Ablaufsteuerung / SFC</option><option value="Kapitel 4 — VPS und Kontaktsteuerung">Kapitel 4 — VPS und Kontaktsteuerung</option>
    </select>
    <button class="btn" id="shuffle">Mischen</button>
  </div>

  <div class="progress"><i id="bar-i"></i></div>

  <div class="stage" id="stage">
    <button class="card" id="card" aria-live="polite">
      <div class="face front">
        <div class="face-body">
          <div class="tagrow">
            <span class="tag klausur" id="klausur-f" hidden>Klausurrelevant</span>
          </div>
          <p class="q" id="q"></p>
          <span class="hint mono">Tippen oder Leertaste zum Umdrehen</span>
        </div>
        <div class="schriftfeld mono">
          <div id="kap-f"></div><div id="src-f"></div><div id="nr-f"></div>
        </div>
      </div>
      <div class="face back">
        <div class="face-body">
          <div class="tagrow">
            <span class="tag seite">Antwort</span>
            <span class="tag klausur" id="klausur-b" hidden>Klausurrelevant</span>
          </div>
          <p class="a" id="a"></p>
        </div>
        <div class="schriftfeld mono">
          <div id="kap-b"></div><div id="src-b"></div><div id="nr-b"></div>
        </div>
      </div>
    </button>
  </div>

  <div class="empty" id="empty" hidden>
    Keine Karten in dieser Auswahl. Filter zurücksetzen oder Kapitel wechseln.
  </div>

  <div class="rate" id="rate">
    <button class="again" id="again">Nochmal <span class="mono">(N)</span></button>
    <button class="ok" id="ok">Sitzt <span class="mono">(J)</span></button>
  </div>

  <div class="stats mono">
    <span>Gewusst <b id="s-known">0</b> von <b id="s-total">0</b></span>
    <span>Klausurkarten <b id="s-star">0</b></span>
  </div>
</div>
<script>window.KARTEN=[{"kap": "Kapitel 1 — Grundlagen", "q": "Wie ist Automatisierung definiert?", "a": "Durch Automatisierung werden dynamische Prozesse in ihrem Verlauf erfasst und derart gezielt beeinflusst, dass sie vorgegebene Aufgaben und Funktionen selbsttätig erfüllen.", "star": false, "src": "Kap. 1/8", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Wie ist ein System definiert?", "a": "Ein System ist ein aus mehreren Einzelteilen zusammengesetztes Ganzes: die Gesamtheit von Elementen, die miteinander verbunden sind und dadurch als eine aufgaben-, sinn- oder zweckgebundene Einheit angesehen werden können — als strukturierte systematische Ganzheit.", "star": false, "src": "Kap. 1/9", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Unterscheide offenes, geschlossenes und abgeschlossenes System.", "a": "Beim <strong>offenen</strong> System fließen Energie und Stoff über die Grenze. Beim <strong>geschlossenen</strong> nur Energie, kein Stoff. Beim <strong>abgeschlossenen</strong> weder noch.", "star": false, "src": "Kap. 1/9", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Wie ist ein Prozess definiert?", "a": "Die Gesamtheit von aufeinander einwirkenden Vorgängen und Veränderungen in einem System, durch die Materie, Energie oder Information umgeformt, transportiert oder gespeichert wird. Ein technischer Prozess ist die Gesamtheit der Vorgänge in einer technischen Anlage.", "star": false, "src": "Kap. 1/11", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Was wird in einem Fertigungsprozess umgewandelt?", "a": "Drei Flüsse laufen parallel: Stoffumwandlung (Eingangsstoff → Ausgangsstoff), Energieumwandlung und Informationsumwandlung.", "star": false, "src": "Kap. 1/11", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Wie ist ein Automat definiert?", "a": "Eine Maschine, die vorbestimmte Abläufe selbsttätig ausführt. Der Begriff Automatik steht für eine Vorrichtung, die einen Vorgang steuert und regelt. Beispiel: Fahrkartenautomat.", "star": false, "src": "Kap. 1/12", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Was ist ein Agent?", "a": "Automaten, die rein auf Informationsebene arbeiten. Sie bestehen aus Software in Form eines Programmcodes. Beispiel: Twitter-Bot.", "star": false, "src": "Kap. 1/12", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Nenne die sieben allgemeinen Ziele der Automation mit Beispiel.", "a": "Ökonomisch (Rationalisierung, Optimierung), gleichmäßig (Stromproduktion), zuverlässig und präzise (Weltraumsonde), sicher (Kraftwerk), ökologisch (ressourcenschonend), komfortabel (Spülmaschine), flexibel (3D-Drucker). Oberziel: Kosteneffizienz und Qualität.", "star": false, "src": "Kap. 1/19", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Nenne die fünf Basisaufgaben der Automation.", "a": "Messen und Wandeln von Prozessgrößen. Steuern und Sichern durch Abarbeitung von Logikprogrammen. Regeln zur Stabilisierung von Prozessgrößen. Überwachen und Erkennen von gefährlichen Prozesszuständen. Anzeigen und Bedienen — Darstellen von und Eingriff auf Prozess- und Führungsgrößen.", "star": false, "src": "Kap. 1/20", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Nenne die drei Basisaufgaben der Information.", "a": "Archivieren (Bereitstellen über lange Zeiträume), Vermitteln (zwischen den Leitebenen) und Absichern (gegen unerlaubte Zugriffe von innen oder außen). Realisiert werden sie durch moderne Prozessleitsysteme.", "star": false, "src": "Kap. 1/20", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Wie ist ein Prozessleitsystem definiert?", "a": "Ein Prozessleitsystem (PLS, englisch Distributed Control System DCS) ist ein hierarchisches und integriertes System zur technischen Realisierung der Aufgaben der Prozessleittechnik.", "star": false, "src": "Kap. 1/21", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Nenne die fünf Ebenen der Automatisierungspyramide von oben nach unten.", "a": "ERP (Enterprise Resource Planning) auf der Unternehmensebene. MES (Manufacturing Execution System) auf der Betriebsleitebene. SCADA (Supervisory Control and Data Acquisition) auf der Prozessleitebene. PLC beziehungsweise SPS auf der Steuerungsebene. Ein- und Ausgangssignale auf der Feldebene.", "star": true, "src": "Kap. 1/21", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "In welche Richtung laufen Daten und Planung in der Automatisierungspyramide?", "a": "Daten werden von unten nach oben erfasst, Planung wirkt von oben nach unten.", "star": false, "src": "Kap. 1/21", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Was kennzeichnet Industrie 1.0?", "a": "Mechanisierung. 1784 der erste mechanische Webstuhl; die mechanische Massenproduktion führte zu hoher Arbeitslosigkeit und den Weberaufständen. Später Dampfmaschinen, Eisenbahnen, Kohleabbau, Schwerindustrie.", "star": false, "src": "Kap. 1/24", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Was kennzeichnet Industrie 2.0?", "a": "Elektrifizierung. 1870 das erste Fließband, Ende des 19. Jahrhunderts die Einführung der Elektrizität als Antriebskraft. Fließband, Motoren, Telefon, Telegramm, Schreibmaschine.", "star": false, "src": "Kap. 1/24", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Was kennzeichnet Industrie 3.0?", "a": "Automatisierung. 1941 entwickelte Konrad Zuse den Z3-Computer, 1969 kam die erste speicherprogrammierbare Steuerung. Personal Computer begründen einen neuen Industriezweig; Vernetzung von Elektronik und IT steht im Fokus.", "star": true, "src": "Kap. 1/25", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Was kennzeichnet Industrie 4.0?", "a": "Vernetzung. Weltweite Vernetzung und Interaktion, Integration cyber-physischer Systeme, Informatisierung der Lebens- und Arbeitswelt, künstliche Intelligenz in allen Arbeitsbereichen, neue Geschäftsmodelle wie Predictive Maintenance.", "star": false, "src": "Kap. 1/25", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Welche war die erste SPS der Welt?", "a": "Die „Modicon 084\" von Richard E. Morley, 1968. Ihr Prinzip: programmierte Verknüpfungen von Ein- und Ausgängen statt fester Verdrahtung.", "star": true, "src": "Kap. 1/28", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Nenne die drei Ebenen einer intelligenten Produktionsanlage.", "a": "<strong>Kognitive Ebene</strong> — Auswertung von Langzeitdaten ermöglicht Optimierungen, die die Szenarien der assoziativen Ebene modifizieren. <strong>Assoziative Ebene</strong> — Überwachung und Erkennung etwa von Notfallszenarien, Umschaltung der Konfiguration, weiche Echtzeit. <strong>Klassische Steuerungsebene</strong> — elementare Funktionen durch die SPS, harte Echtzeit.", "star": false, "src": "Kap. 1/35", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Wodurch unterscheiden sich intelligente von klassischen Automatisierungssystemen?", "a": "Durch die Erweiterung um Wahrnehmungs- und Lernfähigkeiten. Das ist der signifikante Evolutionsschritt gegenüber der klassischen Automation.", "star": false, "src": "Kap. 1/36", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Welche Anforderungen stellt modellbasierte Automation in Produktion und Fertigung?", "a": "Harte Echtzeit, Verfügbarkeit und Sicherheit.", "star": false, "src": "Kap. 1/23", "code": "K1"}, {"kap": "Kapitel 1 — Grundlagen", "q": "Was ist der Vorteil der Modulbauweise bei Flachbaugruppen?", "a": "Sie ist für einfache und komplexe Systeme gleichermaßen geeignet.", "star": false, "src": "Kap. 1/29", "code": "K1"}, {"kap": "Kapitel 2 — Systeme", "q": "Wie definiert DIN 19226 Teil 1 das Steuern?", "a": "Das Steuern ist ein Vorgang in einem System, bei dem die Eingangsgrößen die Ausgangsgrößen aufgrund der dem System eigentümlichen Gesetzmäßigkeiten beeinflussen. Kennzeichen: offene Wirkungskette, keine Rückführung.", "star": true, "src": "Kap. 2/70", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Wie lautet die exakte Definition der Kausalität?", "a": "Ein System ist kausal, wenn der Output zu jedem Zeitpunkt nur von den Werten des Inputs zu der betreffenden Zeit und davor abhängt.", "star": false, "src": "Kap. 2/37", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Wie lautet die exakte Definition der Zeitinvarianz?", "a": "Ein System ist zeitinvariant, wenn eine Zeitverschiebung des Inputs zu einer Zeitverschiebung des Outputs führt. Ist y(t) der Output zum Input u(t), so ist y(t−T) der Output, wenn u(t−T) angelegt wird. Zeitdiskret entsprechend: y[k−K] zum Input u[k−K].", "star": false, "src": "Kap. 2/44", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Woran erkennt man ein zeitvariantes System?", "a": "Taucht die Zeit <strong>explizit</strong> im Modell auf, ist das System zeitvariant. Beispiel Rakete: Die Masse ist wegen des Treibstoffverbrauchs zeitabhängig, das Modell lautet ÿ(t) = u(t) / M(t).", "star": false, "src": "Kap. 2/44", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Welche zwei Eigenschaften machen ein System linear?", "a": "<strong>Superposition</strong> — der Output für u₁(t) + u₂(t) ist gleich y₁(t) + y₂(t). <strong>Homogenität</strong> — der Output von α·u₁(t) ist gleich α·y₁(t). Zusammengefasst: α·u₁(t) + β·u₂(t) → α·y₁(t) + β·y₂(t).", "star": true, "src": "Kap. 2/48", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Welche Folgerung ergibt sich direkt aus der Homogenität?", "a": "Input Null ergibt Output Null. Liefert ein System bei Eingang null einen Ausgang ungleich null, kann es nicht linear sein — ein schneller Test.", "star": true, "src": "Kap. 2/48", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Wie ist das Gleichgewicht definiert und wie heißt es noch?", "a": "Ein System befindet sich im Gleichgewicht, wenn sich die Kenn- und Zustandsgrößen nicht mehr mit der Zeit ändern. Weitere Namen: Stationärzustand, Steady State, Fließgleichgewicht. Bedingung kontinuierlich dx/dt = 0 für alle t, diskret x[k+1] − x[k] = 0 für alle k.", "star": false, "src": "Kap. 2/55", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Welche Frage beantwortet die Stabilität?", "a": "Welche Auswirkung eine kleine Störung auf ein System im Steady State hat. Asymptotisch stabil: erreicht nach Anregung mit endlicher Energie wieder seine Ruheposition. Grenzstabil: konvergiert zu einem konstanten Ausgangswert. Instabil: kehrt nicht ins Gleichgewicht zurück und divergiert.", "star": false, "src": "Kap. 2/63", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Was leistet die Systemtheorie in der Automatisierung?", "a": "Drei Dinge: Simulation „in silico\", also computerbasierte und mathematische Modelle, mit denen physikalische und physiologische Vorgänge virtuell nachgestellt werden. Mächtige systemtheoretische Werkzeuge zur Analyse und Optimierung. Und eine Vielzahl an Steuerungs- und Regelmethoden für ein gewünschtes Systemverhalten.", "star": false, "src": "Kap. 2/67", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Was ist der Unterschied zwischen Steuerung und Regelung?", "a": "Die Steuerung ist eine offene Kette ohne Messung des Ausgangs und kann deshalb nicht auf Störungen reagieren. Die Regelung misst die Ausgangsgröße und führt sie zurück, vergleicht mit dem Sollwert und korrigiert. Nur die Regelung kann von Haus aus instabile Systeme stabilisieren.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Wann ist ein System statisch, wann dynamisch?", "a": "Statisch, wenn es keinen Energiespeicher hat — der Ausgang hängt allein vom Eingang zum selben Zeitpunkt ab, Beschreibung durch eine algebraische Gleichung. Dynamisch, wenn es mindestens einen Energiespeicher hat — Beschreibung durch eine Differentialgleichung, bei zeitdiskreten Systemen durch eine Differenzengleichung.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Was bedeuten SISO und MIMO?", "a": "SISO ist ein Eingrößensystem mit einer Eingangs- und einer Ausgangsgröße. MIMO ist ein Mehrgrößensystem mit mehreren. Die Vorlesung behandelt bevorzugt SISO.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Nenne die sieben Systemeigenschaften aus Handout H2.", "a": "Linearität, Zeitinvarianz, Kausalität, Determiniertheit, asymptotische Stabilität, Grenzstabilität, Instabilität.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Was besagt Linearität?", "a": "Superposition und Homogenität: Reagiert das System auf eine Linearkombination von Eingangssignalen u = α₁u₁ + α₂u₂ mit derselben Linearkombination der Ausgangssignale y = α₁y₁ + α₂y₂, ist es linear.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Was besagt Zeitinvarianz?", "a": "Ein um T verzögertes Eingangssignal u(t−T) erzeugt ein um T verzögertes Ausgangssignal y(t−T). Das System verhält sich heute wie morgen.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Was besagt Kausalität?", "a": "Das System reagiert auf ein Eingangssignal erst nach Beginn der Anregung, niemals vorher.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Wie lautet die Gleichgewichtsbedingung?", "a": "Kontinuierlich dx/dt = 0 für alle t, diskret x[k+1] − x[k] = 0 für alle k. Ein Gleichgewicht muss nicht existieren; es kann eines, mehrere oder unendlich viele geben.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Erkläre asymptotisch stabil, grenzstabil und instabil am Kugelbild.", "a": "Kugel in der Mulde: Kraft treibt zurück, Reibung entzieht Energie, die Kugel kommt in der Ruhelage an — asymptotisch stabil. Kugel auf der Ebene: keine tangentiale Kraft, sie bleibt liegen, wandert aber nicht weiter — grenzstabil. Kugel auf der Kuppe: die Kraft wächst mit der Auslenkung, sie rollt davon — instabil.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Welche drei Verkettungsarten gibt es im Blockschaltbild?", "a": "Reihenschaltung (Ausgang des einen ist Eingang des nächsten), Parallelschaltung (gleicher Eingang auf mehrere Blöcke, Ausgänge summiert) und Rückführung (Ausgang wird auf den Eingang zurückgeführt — die Struktur des Regelkreises).", "star": true, "src": "Kap. 2/14–16", "code": "K2"}, {"kap": "Kapitel 2 — Systeme", "q": "Welche Voraussetzung muss jeder Block im Blockschaltbild erfüllen?", "a": "Rückwirkungsfreiheit. Signale fließen nur vom Eingang eines Blocks zu dessen Ausgang, es gibt keine nicht dargestellten Nebeneffekte zwischen Blöcken.", "star": false, "src": "", "code": "K2"}, {"kap": "Kapitel 2.1 — Signale", "q": "Was ist ein Signal, was ein System?", "a": "Signale sind Funktionen einer oder mehrerer unabhängiger Variablen — zum Beispiel Zeit oder Ort — und enthalten Information über das Verhalten bestimmter Erscheinungen. Systeme verarbeiten spezielle Signale und erzeugen wiederum neue: Aus Eingangssignalen werden Ausgangssignale erzeugt.", "star": false, "src": "Kap. 2.1/5", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Wie wirkt die Umgebung auf ein System ein?", "a": "Alle nicht abgeschlossenen Systeme — offene wie geschlossene — stehen im Kontakt mit ihrer Umwelt und tauschen mit ihr Materie, Energie oder Information aus. Die Umwelt wirkt typischerweise durch <strong>Störungen</strong> auf das System ein.", "star": false, "src": "Kap. 2.1/4", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Wie notiert man zeitkontinuierliche und zeitdiskrete Signale?", "a": "Kontinuierliche Signale bekommen <strong>runde</strong> Klammern, die unabhängige Variable ist reell und heißt meist t: u(t). Diskrete Signale bekommen <strong>eckige</strong> Klammern, die unabhängige Variable ist ganzzahlig und heißt meist k oder n: u[k].", "star": true, "src": "Kap. 2.1/47", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Wie ist die Abtastung formal definiert?", "a": "Ein kontinuierliches Signal wird mit dem Abtastintervall T_A beziehungsweise der Abtastfrequenz f_A := 1/T_A zu äquidistanten Zeitpunkten k·T_A gemessen, mit k = {0, 1, 2, …}. Dabei entsteht das zeitdiskrete Signal <code>x[k] := x(k · T_A)</code>.", "star": true, "src": "Kap. 2.1/37", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Wie lautet das Shannon-Nyquist-Abtasttheorem?", "a": "Eine Funktion, die keine Frequenzen höher als f_max enthält, ist durch eine beliebige Reihe von Funktionswerten im Abstand <code>T_A &lt; 1/(2·f_max)</code> eindeutig bestimmt. Das entspricht einer Abtastrate <code>f_A &gt; 2 · f_max</code>.", "star": true, "src": "Kap. 2.1/41", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Warum muss die Bandbreite begrenzt sein?", "a": "Bei der Abtastung ist zu beachten, dass die Bandbreite — also die im Signal auftretenden Frequenzen — begrenzt ist. Ansonsten tritt ein gravierender Informationsverlust auf, genannt <strong>Aliasing</strong>.", "star": true, "src": "Kap. 2.1/41", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Nenne die wichtigen Standardsignale.", "a": "Sprungfunktion, Rechteckfunktion, Signumfunktion, Rampenfunktion, Exponentialfunktion, periodische Signale und der Dirac-Impuls.", "star": false, "src": "Kap. 2.1/11–19", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Wie schreibt man eine Rechteckfunktion mit Sprungfunktionen?", "a": "Als Differenz zweier verschobener Sprünge: σ(t) − σ(t−T).", "star": true, "src": "Kap. 2.1/12", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Was ist der Unterschied zwischen Abtastung und Quantisierung?", "a": "Abtastung macht aus zeitkontinuierlich zeitdiskret — es werden zu festen Zeitpunkten Werte entnommen. Quantisierung macht aus wertkontinuierlich wertdiskret — die Werte werden auf Stufen gerundet. Zusammen ergibt das die Digitalisierung.", "star": false, "src": "", "code": "K2.1"}, {"kap": "Kapitel 2.1 — Signale", "q": "Was ist Aliasing und wie vermeidet man es?", "a": "Wird zu langsam abgetastet, erscheint im rekonstruierten Signal eine Frequenz, die im Original gar nicht vorkommt. Der Informationsverlust ist nicht reparierbar. Vermeidung: Das Signal muss bandbegrenzt sein und hinreichend schnell abgetastet werden.", "star": false, "src": "Kap. 2.1/43", "code": "K2.1"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Was sagen die De Morganschen Gesetze?", "a": "¬(A ∧ B) = ¬A ∨ ¬B und ¬(A ∨ B) = ¬A ∧ ¬B. In Worten: Bei der Negation einer Klammer wird jedes Element negiert und das Verknüpfungszeichen gekippt. Benannt nach Augustus De Morgan, bekannt waren sie schon dem mittelalterlichen Logiker Wilhelm von Ockham.", "star": false, "src": "Kap. 3/17", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wozu dienen die De Morganschen Gesetze in der Praxis?", "a": "Eine Konjunktion lässt sich durch drei Negationen und eine Disjunktion darstellen und umgekehrt. Dadurch kann man Gattertypen gegeneinander austauschen und Bauteile einsparen — eine Schaltung lässt sich mit reinen NAND- oder reinen NOR-Gattern aufbauen.", "star": false, "src": "Kap. 3/18", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Was ist der BCD-Code?", "a": "Binary-coded decimal, dualkodierte Dezimalziffer. Jede Dezimalziffer 0 bis 9 wird durch vier Bit dargestellt, also in einem Halbbyte.", "star": true, "src": "Kap. 3/45", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Unterscheide analoges und digitales Signal.", "a": "Beim analogen Signal bildet der Signalparameter Nachrichten kontinuierlich ab und kann beliebig viele Werte annehmen. Beim digitalen Signal besteht die Nachricht nur aus Zeichen, der Signalparameter kann nur endlich viele Werte annehmen.", "star": false, "src": "", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Was ist ein Signalparameter?", "a": "Diejenige Größe des Signals, deren Wert oder Werteverlauf die Nachricht darstellt — zum Beispiel die Amplitude bei einer amplitudenmodulierten Wechselspannung.", "star": false, "src": "", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Warum dominieren binäre Signale in der Automatisierungstechnik?", "a": "Drei Gründe: weniger Übertragungsfehler, weil nur zwei Interpretationen möglich sind; einfache Speicherung, da Systeme mit mehr als zwei stabilen Zuständen aufwendig und unsicher sind; und viele technische Realisierungen — Ein/Aus, Potential vorhanden oder nicht, Rechtecksignal, Potentialdifferenz.", "star": false, "src": "", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Unterscheide Bit, bit und Byte.", "a": "Bit ist die Kurzform für Binärzeichen, also Binärziffer oder -stelle. bit ist die Maßeinheit der Information. Byte ist eine Gruppe von 8 Binärzeichen.", "star": false, "src": "", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Welche Voraussetzung braucht die Schaltalgebra für uneingeschränkte Gültigkeit?", "a": "Alle Schaltzeiten müssen null sein. Genau hier setzt das Hazard-Thema an: Reale Gatter haben Laufzeiten und verletzen diese Annahme.", "star": false, "src": "Kap. 3/10", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Nenne die vier UND-Regeln mit Konstanten.", "a": "0 ∧ A = 0, 1 ∧ A = A, A ∧ A = A, A ∧ ¬A = 0.", "star": true, "src": "Kap. 3/13", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Nenne die vier ODER-Regeln mit Konstanten.", "a": "0 ∨ A = A, 1 ∨ A = 1, A ∨ A = A, A ∨ ¬A = 1.", "star": true, "src": "Kap. 3/13", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wie viele Zeilen und wie viele Verknüpfungen gibt es bei n Eingangsvariablen?", "a": "K = 2ⁿ Kombinationsmöglichkeiten, also Zeilen der Wahrheitstabelle, und V = 2^K = 2^(2ⁿ) mögliche Verknüpfungen. Bei n = 2 also 4 Zeilen und 16 Verknüpfungen.", "star": true, "src": "Kap. 3/29", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wie unterscheiden sich deutsche und amerikanische Norm bei den Vorrangregeln?", "a": "In der deutschen Norm binden UND und ODER <strong>gleich stark</strong>, in der amerikanischen bindet UND stärker als ODER (Punkt vor Strich). In beiden bindet die Negation am stärksten. Empfehlung der Vorlesung: Bei ODER immer klammern.", "star": false, "src": "Kap. 3/43", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wie bildet man die DNF?", "a": "Alle Zeilen mit Ausgang 1 betrachten. Je Zeile einen Minterm bilden: alle Variablen UND-verknüpft, negiert wenn die Variable in der Zeile 0 ist. Alle Minterme ODER-verknüpfen. Kurz: UND vor ODER.", "star": true, "src": "Kap. 3/50", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wie bildet man die KNF?", "a": "Alle Zeilen mit Ausgang 0 betrachten. Je Zeile einen Maxterm bilden: alle Variablen ODER-verknüpft, negiert wenn die Variable in der Zeile 1 ist. Alle Maxterme UND-verknüpfen.", "star": true, "src": "Kap. 3/52", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wie kommt man von der DNF zur KNF?", "a": "Man bildet die DNF der Umkehrfunktion und invertiert sie. Alternativ im KV-Diagramm die Nullen zusammenfassen, das ergibt die disjunktive Minimalform von ¬Y, und darauf De Morgan anwenden.", "star": false, "src": "", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wie sind KV-Tafeln aufgebaut?", "a": "Nachbarfelder unterscheiden sich in genau einer Variablen (Gray-Code). Randfelder gelten als benachbart, die Tafel ist gedanklich ein Torus. Bei n Eingangsvariablen gibt es 2ⁿ Felder. Jedes Feld erhält den Funktionswert aus der Wahrheitstabelle.", "star": true, "src": "Kap. 3/59", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Nenne die vier Regeln des KV-Minimierungsverfahrens.", "a": "1. Signalwerte in die nummerierten Felder eintragen. 2. Symmetrisch liegende 1-Felder zu Zweier-, Vierer- oder Achterblöcken einkreisen. 3. Jedes 1-Feld mindestens einmal einkreisen, möglichst große Einkreisungen finden. 4. Bei Zweier-, Vierer-, Achterblöcken entfallen genau 1, 2, 3 Variablen.", "star": true, "src": "Handout 4", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wie viele Variablen entfallen bei einem Block der Größe 2^k?", "a": "Genau k Variablen. Deshalb immer so groß wie möglich einkreisen, Überlappungen sind erlaubt und oft nötig.", "star": false, "src": "", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Was sind Don't-Care-Terme und wie behandelt man sie?", "a": "Eingangskombinationen, die technisch nicht auftreten können oder deren Ergebnis gleichgültig ist. Sie werden als X in die KV-Tafel eingetragen und dürfen nach Belieben als 0 oder 1 gelesen werden. Ein X wird nur einbezogen, wenn es einen Block vergrößert — es <strong>muss</strong> nicht überdeckt werden.", "star": true, "src": "Kap. 3/70", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Bis wie viele Variablen ist das KV-Diagramm praktikabel?", "a": "Etwa sechs. Vorgeschlagen 1952 von Veitch, 1953 von Karnaugh modifiziert.", "star": false, "src": "Kap. 3/58", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Was ist der Unterschied zwischen Glitch und Hazard?", "a": "Ein Glitch ist eine nicht beabsichtigte Signaländerung am Gatterausgang. Ein Hazard ist die Konfiguration, bei der ein Glitch auftreten <strong>kann</strong>, aber nicht muss.", "star": false, "src": "Kap. 3/80", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wodurch entstehen Glitches?", "a": "Dadurch, dass verschiedene Pfade durch ein Schaltnetz unterschiedliche Laufzeiten haben. Beispiel: A ∧ ¬A müsste immer 0 sein, durch die Inverter-Laufzeit entsteht aber ein kurzer Puls.", "star": false, "src": "", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wie groß ist eine typische Gatterverzögerung?", "a": "Etwa 100 Pikosekunden bis 100 Nanosekunden, je nach Logikfamilie. Die Verzögerung bei fallender Flanke kann sich von der bei steigender unterscheiden.", "star": false, "src": "Kap. 3/78", "code": "K3"}, {"kap": "Kapitel 3 — Digitaltechnik", "q": "Wann entstehen Hazards im KV-Diagramm und wie beseitigt man sie?", "a": "Hazards entstehen, wenn zwei Primterm-Blöcke überlappungsfrei aneinandergrenzen. Lösung: einen zusätzlichen Primterm-Block einfügen, der die Überlappung der 1-Menge garantiert — also einen logisch redundanten Term ergänzen.", "star": false, "src": "Kap. 3/85–86", "code": "K3"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Welche drei Arten der Steuerung werden unterschieden?", "a": "Binäre Steuerung (Beispiel: Vorschubtisch einer Schleifmaschine), kombinatorische Steuerung (Beispiel: Zünden eines Schweißbrenners) und digitale Steuerung, bei der die Signalverarbeitung codiert in Zahlen erfolgt (Beispiel: CNC-Vorschubantrieb).", "star": false, "src": "Kap. 4/5–8", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Was unterscheidet zeitgeführte von prozessgeführter Steuerung?", "a": "Bei der zeitgeführten Steuerung erfolgt die Weiterschaltung nach Ablauf einer Zeit — sie wird immer weniger eingesetzt, weil sie nicht flexibel genug ist. Bei der prozessgeführten Steuerung sind die Ereignisse prozessabhängig, die Weiterschaltung erfolgt durch Sensorsignale.", "star": false, "src": "Kap. 4/10–11", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Nenne die beiden Ausführungen elektrischer Steuerungen.", "a": "Verbindungsprogrammiert (VPS) und speicherprogrammiert (SPS).", "star": false, "src": "Kap. 4/13", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Vergleiche VPS und SPS in vier Merkmalen.", "a": "Hardware: VPS aufgabenspezifisch, SPS aufgabenneutral. Funktionsrealisierung: VPS über elektrische Verbindungen, SPS als abgespeichertes Programm. Interne Verarbeitung: VPS zeitlich parallel, SPS zeitzyklisch und im Zyklus seriell. Aufgabenänderung: VPS Neuverdrahtung, SPS Neuprogrammierung.", "star": true, "src": "Kap. 5/3", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Wozu dienen Relais und Schütze?", "a": "Sie übertragen Schaltsignale von einem Stromkreis in einen anderen, verstärken und vervielfachen sie, ohne dass die Kreise verbunden sind. Es erfolgt die Trennung zwischen Steuer- und Laststromkreis.", "star": false, "src": "Kap. 4/26", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Wie unterscheiden sich Relais und Schütz?", "a": "Relais schalten bis etwa 1 kW, haben meist keine Funkenlöschkammern und einfach unterbrechende Kontakte. Schütze schalten bis etwa 500 kW, arbeiten elektromagnetisch mit Anker und haben immer doppelt unterbrechende Kontakte.", "star": false, "src": "Kap. 4/27–29", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Was unterscheidet Leistungsschütz und Hilfsschütz?", "a": "Leistungsschütze schalten große Lasten und haben Lichtbogen-Löscheinrichtungen. Hilfsschütze schalten kleinere Steuerspannungen.", "star": false, "src": "Kap. 4/30", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Wie werden Relais und Schütze gekennzeichnet?", "a": "K für Relais, Q für Schütz. Spulenanschlüsse A1 (+) und A2 (−). Hauptstromkontakte einstellig: 3/4 bei Gleichstrom, 1/2 bei Wechselstrom. Steuerkontakte zweistellig: erste Ziffer ist die fortlaufende Ordnungsziffer, zweite Ziffer die Funktionsziffer — 1/2 bedeutet Öffner, 3/4 bedeutet Schließer.", "star": true, "src": "Kap. 4/31", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Was bedeutet die Kontaktbezeichnung 13/14, was 21/22?", "a": "13/14 ist der erste Schließer (Funktionsziffer 3/4), 21/22 der zweite Öffner (Funktionsziffer 1/2).", "star": true, "src": "", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Welche drei Aspekte kennt die Kennzeichnung im Schaltplan?", "a": "Produktaspekt mit Vorzeichen Minus (woraus besteht das Objekt), Funktionsaspekt mit Vorzeichen Gleich (was soll es tun) und Ortsaspekt mit Vorzeichen Plus (wo steht es).", "star": false, "src": "Kap. 4/24", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Wie entsteht ein Lichtbogen beim Schalten?", "a": "Beim Öffnen unter Last will die Leitungsinduktivität den Stromfluss aufrechterhalten. Die Berührungsfläche wird kleiner, Stromdichte und Temperatur steigen, die Luft ionisiert und wird leitend. Folge ist Abbrand: Kontaktmaterial schmilzt und verdampft.", "star": false, "src": "Kap. 4/35", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Warum ist der Abbrand bei Wechselstrom schwächer als bei Gleichstrom?", "a": "Weil im Nulldurchgang des Wechselstroms die Ionisierung unterbrochen wird.", "star": false, "src": "", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Nenne drei Funkenlöschmethoden bei kleinen Leistungen.", "a": "RC-Kombination, Varistor (spannungsabhängiger Widerstand) und Freilaufdiode.", "star": false, "src": "Kap. 4/36", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "In welchem Zustand werden Kontaktsteuerungen im Schaltplan dargestellt?", "a": "Immer im nicht geschalteten Zustand — stromlos, Taster unbetätigt.", "star": true, "src": "Kap. 4/39", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Was unterscheidet den ausführlichen vom kompakten Stromlaufplan?", "a": "Der ausführliche zeigt alle Einzelheiten und wird wegen des Umfangs nur noch selten verwendet. Im kompakten, aufgelösten Plan bekommt jedes Betriebsmittel einen senkrecht gezeichneten Stromweg, von oben nach unten und von links nach rechts.", "star": false, "src": "Kap. 4/39–40", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Was kann man mit einem Relais oder Schütz tun?", "a": "Übertragen (Hilfsstromkreis auf Hauptstromkreis), verstärken (kleine Steuerleistung schaltet große Last), umkehren, verriegeln, allgemein logisch verknüpfen und speichern.", "star": false, "src": "Kap. 4/41–42", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Wie funktioniert die Selbsthaltung?", "a": "Im Stromkreis des Relais K1 liegt ein Schließer desselben Relais K1 parallel zum EIN-Taster S1. Wird S1 kurz betätigt, zieht K1 an, der Schließer K1 überbrückt S1, und K1 bleibt erregt. Der Einschaltimpuls ist gespeichert.", "star": true, "src": "Kap. 4/42", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Was ist der Zusammenhang zwischen Selbsthaltung und Schaltnetz/Schaltwerk?", "a": "Schaltnetz = ohne Selbsthaltung, der Ausgang hängt nur vom aktuellen Eingang ab. Schaltwerk = mit Selbsthaltung, es gibt einen gespeicherten Zustand.", "star": true, "src": "Kap. 4/42", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Was bedeutet dominierend setzend und dominierend rücksetzend?", "a": "Das dominierende Verhalten gibt an, wie die Schaltung auf gleichzeitiges EIN und AUS reagiert. Bei dominierend setzend hat die Erregung Vorrang vor dem AUS-Taster, bei dominierend rücksetzend ist es umgekehrt.", "star": false, "src": "Kap. 4/46", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Wozu dient die Wendeschützschaltung?", "a": "Zur Umkehr der Drehrichtung von Drehstrommotoren. Zwei Schütze Q1 und Q2 vertauschen im Laststromkreis zwei Außenleiter. Sie müssen zwingend gegeneinander verriegelt sein.", "star": false, "src": "Kap. 4/49", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Wozu dient die Stern-Dreieck-Schaltung?", "a": "Größere Drehstrommotoren mit Kurzschlussläufer mit reduzierter Leistungsaufnahme anlaufen zu lassen. Das vermeidet das Auslösen von Überstromschutzeinrichtungen wegen des sonst hohen Anlaufstroms bei direktem Anlauf in Dreieckschaltung.", "star": false, "src": "Kap. 4/51", "code": "K4"}, {"kap": "Kapitel 4 — VPS und Kontaktsteuerung", "q": "Wozu dient die Kontaktvervielfachung durch Hilfsschütz?", "a": "Um mehr Kontakte zur Verfügung zu haben, als das Hauptschütz selbst bietet.", "star": false, "src": "Kap. 4/47", "code": "K4"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Was unterscheidet Schaltnetz und Schaltwerk?", "a": "Beim Schaltnetz hängt der Ausgang nur von der aktuellen Eingangsbelegung ab, es ist rein kombinatorisch. Das Schaltwerk hat zusätzlich Speicher oder Zeitglieder — der Ausgang hängt von Eingang <strong>und</strong> innerem Zustand ab.", "star": true, "src": "Kap. 4.2/3, Kap. 7/4", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Was ist der Unterschied zwischen SR- und RS-Speicher?", "a": "Nur der Vorrang bei gleichzeitigem Setzen und Rücksetzen. SR ist setzdominant, RS ist rücksetzdominant. In der Foliennotation gilt: Der Eingang, der im Funktionsplan <strong>unten am Q</strong> steht, wird in der Anweisungsliste zuletzt ausgeführt und gewinnt deshalb.", "star": true, "src": "Kap. 4.2/5", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Wie sieht „Speichern mit vorrangigem Rücksetzen\" in der Anweisungsliste aus?", "a": "Erst setzen, dann rücksetzen — die letzte Operation gewinnt: <code>U E1 / S A / U E0 / R A</code>. In ST: <code>IF E1 THEN A := TRUE; END_IF; IF E0 THEN A := FALSE; END_IF;</code>", "star": false, "src": "Kap. 4.2/5", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Welchen Speichervorrang wählt man in der Sicherheitstechnik?", "a": "Rücksetzdominant. Ein gleichzeitig anliegendes AUS muss in jedem Fall gewinnen.", "star": false, "src": "", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Welcher Zählerbaustein ist der Standard nach IEC 61131?", "a": "CTUD, count up/down. Er zählt bei steigender Flanke an CU aufwärts und an CD abwärts, wird über LOAD auf den Vorgabewert PV gesetzt und über RESET genullt.", "star": false, "src": "Kap. 4.2/10", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Was tun TON, TOF und TP?", "a": "TON ist die Einschaltverzögerung: liegt IN durchgehend für die Zeit PT an, wird Q wahr. TOF ist die Ausschaltverzögerung. TP ist der Impuls fester Länge.", "star": false, "src": "", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Welche zwei Operanden gehören zur Flankenauswertung?", "a": "Ein Flankenoperand F0, der den veränderten Signalwert speichert, und ein Impulsoperand I0, der beim Auftreten der Flanke für die Dauer <strong>eines Programmzyklus</strong> den Wert 1 führt.", "star": false, "src": "Handout 4", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Welche Codesys-Bausteine gibt es für die Flankenauswertung?", "a": "R_TRIG für die steigende Flanke 0 → 1 und F_TRIG für die fallende Flanke.", "star": false, "src": "", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Wann kann man auf den Impulsoperanden verzichten?", "a": "Wenn die Flankenauswertung nur an einer Stelle des Programms gebraucht wird. Dann verwendet man den Ausgang direkt, etwa zum Setzen eines SR-Speichers.", "star": false, "src": "", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Was ist die RS-Tabelle und wozu dient sie?", "a": "Ein Hilfsmittel für den systematischen Programmentwurf mit mehreren Speichern. Man betrachtet Ausgangsvariablen — insbesondere Schütze und Hilfsschütze — als Speicher und trägt je Speicher die Setz- und die Rücksetzbedingung ein.", "star": false, "src": "Handout 4", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Wie lautet die Aufgabe „Parkhausanzeige\"?", "a": "Anzeige der freien Plätze. S1 sensiert ein einfahrendes, S2 ein ausfahrendes Auto. Mit dem Taster „Setzen\" wird der Anfangswert 10 eingestellt. Sind keine freien Plätze da, leuchtet eine rote Lampe. Umsetzung mit dem vorgefertigten Zähler <strong>CTUD</strong>.", "star": false, "src": "Kap. 4.2/11", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Wie sieht die erweiterte RS-Tabelle der Drei-Pumpen-Aufgabe aus?", "a": "Schritt 1: Bedingung S1 (0→1), setzt IO1. Schritt 2: IO1 ∧ ¬Q1 ∧ ¬Q2, setzt Q1, setzt IO1 zurück. Schritt 3: IO1 ∧ Q1 ∧ ¬Q2, setzt Q2, setzt IO1 zurück. Schritt 4: IO1 ∧ Q1 ∧ Q2, setzt Q3, setzt IO1 zurück. Zusätzlich: ¬S0 setzt Q1, Q2 und Q3 gemeinsam zurück.", "star": true, "src": "Kap. 4.2/21", "code": "K4.2"}, {"kap": "Kapitel 4.2 — Schaltwerke", "q": "Warum braucht die Drei-Pumpen-Aufgabe eine Flankenauswertung?", "a": "Weil derselbe EIN-Taster S1 dreimal verwendet wird. Ohne Flanke wäre S1 im nächsten Zyklus immer noch 1 und die Kette liefe in einem einzigen Durchlauf durch. Im FUP steht deshalb ein P-Baustein hinter S1, der den Merker IO1 für genau einen Zyklus setzt.", "star": true, "src": "Kap. 4.2/21", "code": "K4.2"}, {"kap": "Kapitel 5 — SPS", "q": "Welche binären Aufgaben erfüllt eine SPS typischerweise?", "a": "Logische Funktionen (UND, ODER), Speicherfunktionen (JK-Flipflop, D-Speicher), Zeitfunktionen (Einschaltverzögerung, Puls), Zählfunktionen (Vorwärts-, Rückwärtszähler) und Flankenerkennung.", "star": false, "src": "Kap. 5/4", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Welche analogen Aufgaben erfüllt eine SPS?", "a": "Konditionierung (Verstärkung, Skalierung, Filterung), Selektion (Grenzwertüberschreitung, Begrenzung, Maximum-Auswahl), Kombination (arithmetische Verknüpfung) und Transformation (Radizieren, Differenzieren, Betrag, Exponieren).", "star": false, "src": "Kap. 5/4", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Was bedeutet das EVA-Prinzip?", "a": "Eingabe — Verarbeitung — Ausgabe. Eine SPS besteht in minimaler Ausführung immer aus Eingabeeinheit, Verarbeitungseinheit und Ausgabeeinheit. Die zyklische Abarbeitung ist grundlegendes Merkmal und nutzt ein Prozessabbild.", "star": true, "src": "Kap. 5/11", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Beschreibe den SPS-Zyklus in drei Schritten.", "a": "Erstens Prozessabbild der Eingänge (PAE) erstellen — alle Eingänge werden einmalig eingelesen und eingefroren. Zweitens Anwenderprogramm abarbeiten, Anweisung für Anweisung seriell. Drittens Prozessabbild der Ausgänge (PAA) ausgeben.", "star": true, "src": "Kap. 5/12", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Was ist die Zykluszeit?", "a": "Die Zeit für die Abarbeitung eines Zyklus einschließlich aller Kommunikationsaufgaben. Sie hängt von der Rechenzeit ab, also von der Zahl der Anweisungen. Höherpriorisierte Tasks unterbrechen den Zyklus und verlängern ihn.", "star": true, "src": "Kap. 5/14", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Was ist die Reaktionszeit und warum ist sie länger als die Zykluszeit?", "a": "Die Reaktionszeit ist die Dauer zwischen der Änderung eines Eingangssignals und der Reaktion am Ausgang. Ändert sich ein Eingang kurz nach dem Einlesen, wird er erst im nächsten Zyklus erfasst und wirkt erst an dessen Ende — im ungünstigsten Fall also fast zwei Zyklen.", "star": true, "src": "Kap. 5/14", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Nenne einen Vorteil und drei Nachteile der zyklischen Programmbearbeitung.", "a": "Vorteil: Die Rechenleistung wird immer genutzt, Zykluszeiten müssen nicht berechnet werden. Nachteile: Weil die Rechenzeit schwanken kann, ist das System streng genommen nicht deterministisch. Zeitkritische Programmteile werden durch Änderungen an anderer Stelle beeinflusst. Und Mehrfachzuweisungen auf einen Ausgang führen immer zu Programmfehlern, weil der spätere Wert den früheren im PAA überschreibt.", "star": false, "src": "Kap. 5/15", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Warum rechnet das Programm mit dem Prozessabbild statt direkt mit den Eingängen?", "a": "Weil Eingangssignale sonst innerhalb eines Zyklus mit unterschiedlichen Werten in die Programmbearbeitung eingehen könnten. Das Prozessabbild friert sie für die Dauer eines Zyklus ein.", "star": false, "src": "", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Woraus besteht die CPU einer SPS?", "a": "Steuerwerk (Befehlszähler, Befehlsregister, Befehlsdecoder, Operationssteuerung — arbeitet das Programm sequentiell ab) und Rechenwerk (ALU für Bit-, Byte- und Wortoperationen).", "star": false, "src": "Kap. 5/10", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Unterscheide Arbeitsspeicher, Ladespeicher und Systemspeicher.", "a": "Der Arbeitsspeicher dient der Abarbeitung des Anwenderprogramms. Der Ladespeicher nimmt Code- und Datenbausteine sowie Systemdaten wie die Hardwarekonfiguration auf. Der Systemspeicher enthält die Operandenbereiche Merker, Zeiten und Zähler sowie die Prozessabbilder und Lokaldaten.", "star": false, "src": "Kap. 5/10", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Nenne die drei Programmorganisationseinheiten nach DIN EN 61131-3.", "a": "Programm (Zyklusbaustein, PLC_PRG), Funktionsbaustein FB — parametrierbar <strong>mit</strong> Speicher — und Funktion FC — parametrierbar <strong>ohne</strong> Speicher.", "star": true, "src": "Handout H3", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Nenne die fünf SPS-Programmiersprachen nach IEC 61131-3.", "a": "Textsprachen: Anweisungsliste AWL (IL) und Strukturierter Text ST (SCL). Grafische Sprachen: Funktionsbausteinsprache FUP (FBD), Kontaktplan KOP (LD) und Ablaufsprache AS (SFC).", "star": true, "src": "Kap. 5/23", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Welches Beschreibungsmittel liegt FBD zugrunde und wofür ist es gedacht?", "a": "Der Logikplan. Zielstellung: Programmierung komplexer Verarbeitungsstrukturen. Standard DIN EN 61131-3, Funktionsbausteinsprache.", "star": false, "src": "Kap. 5/25", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Welches Beschreibungsmittel liegt SFC zugrunde?", "a": "Der Funktionsplan nach DIN 40719 Teil 6, ab 1.4.2005 DIN EN 60848. Zielstellung: komfortable Beschreibung sequentieller Vorgänge, also Schrittketten.", "star": false, "src": "Kap. 5/25", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Welches Beschreibungsmittel liegt IL/AWL zugrunde?", "a": "Algebraische Gleichung und Assemblersprache. Zielstellung: laufzeit- und speicherplatzoptimierte Programme.", "star": false, "src": "Kap. 5/25", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Was ist CFC und ist es genormt?", "a": "Continuous Function Chart, Beschreibungsmittel Signalflussplan und Logikplan, zur Beschreibung kontinuierlicher Vorgänge. Es ist <strong>proprietär</strong> (Siemens), nicht Teil von IEC 61131-3. Ebenso S7-HiGraph mit dem Zustandsgraphen.", "star": false, "src": "Kap. 5/25", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Wie liest man einen Kontaktplan?", "a": "Wie einen Stromlaufplan von links nach rechts. UND ist eine Reihenschaltung, ODER eine Parallelschaltung. Jeder Kontaktplan muss mit einer Zuweisung, einem Funktions- oder Bausteinaufruf abgeschlossen werden.", "star": false, "src": "Handout H3", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Nenne die Bit-Datentypen mit ihrer Größe.", "a": "BOOL 1 Bit (FALSE, TRUE), BYTE 8 Bit, WORD 16 Bit, DWORD 32 Bit, STRING variabel.", "star": true, "src": "Kap. 5/26", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Nenne die Arithmetiktypen mit Wertebereich.", "a": "INT 16 Bit von −32768 bis +32767. DINT 32 Bit von −2147483648 bis +2147483647. REAL 32 Bit als Dezimalzahl mit Punkt, etwa 341.7, oder in Exponentialdarstellung 3.417E+02.", "star": true, "src": "Kap. 5/26", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Nenne die drei Zeittypen mit Größe und Schreibweise.", "a": "TIME 32 Bit, geschrieben <code>t#12h20m30s</code>. TIME_OF_DAY 32 Bit, geschrieben <code>tod#08:36:12</code>. DATE 16 Bit, geschrieben <code>d#1990-01-01</code>.", "star": true, "src": "Kap. 5/26", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Warum sind BYTE, WORD und DWORD nicht einfach vorzeichenlose Zahlen?", "a": "Weil sie auch reine Bitfolgen darstellen können, deren einzelne Bits keine Stellenwertigkeit haben — etwa EB 0 als E 0.0 bis E 0.7.", "star": false, "src": "Kap. 5/26", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Wie ist die Namenskonvention für Variablen aufgebaut?", "a": "Aus drei Bestandteilen: Anwendungsbereich, Kontrolle, Datentyp. Anwendungsbereich: Global g, Local l, POU-Parameter p, Temporary tmp. Kontrolle: Input i, Output o. Datentyp: Bool x, Integer i, Real r, Time tim, Date dt, Char c, Word w, String str.", "star": true, "src": "Kap. 5/27", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Was bedeutet der Variablenname <code>gixS1</code>?", "a": "g = global, i = Input, x = BOOL. Also eine globale Eingangsvariable vom Datentyp BOOL mit dem Bezeichner S1.", "star": true, "src": "Kap. 5/27", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Wie ist die Adressierung nach IEC 61131-3 aufgebaut?", "a": "Prozentzeichen, Präfix für den Speicherort, Präfix für die Größe, dann eine oder mehrere durch Punkte getrennte Zahlen. Speicherort: I (E) Eingang, Q (A) Ausgang, M Merker, DB Datenbaustein, T Zeiten, Z Zähler. Größe: X Bit, B Byte, W Wort, D Doppelwort, L Langwort.", "star": true, "src": "Handout 4", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Was bedeuten <code>%IX136.1</code>, <code>%QW800</code> und <code>%MD10</code>?", "a": "Eingangsbit 136.1, Ausgangswort 800 und Merker-Doppelwort 10.", "star": true, "src": "Handout 4", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Was enthält eine Zuordnungstabelle in Kurzform?", "a": "Drei Spalten: Symbol, Adresse, Kommentar. Beispiel: S1 | E0.1 | Start-Taster, Schließer.", "star": true, "src": "", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Was enthält eine Zuordnungstabelle in Langform?", "a": "Fünf Spalten, getrennt nach Ein- und Ausgängen: Bezeichnung, Datentyp, Symbol, Adresse, Zuordnung. Beispiel: Start-Taster | Bool | S1 | E0.1 | Betätigt = 1. Bei einem Öffner steht dort Betätigt = 0.", "star": true, "src": "", "code": "K5"}, {"kap": "Kapitel 5 — SPS", "q": "Wozu dient die Zuordnungstabelle?", "a": "Sie ordnet alle für die Steuerung relevanten Betriebsmittel den Ein- und Ausgängen zu und legt fest, welche Adresse welches Betriebsmittel bekommt. Sie ist Grundlage für die Planung und für die Deklaration der Variablen in Funktionen und Funktionsbausteinen.", "star": false, "src": "", "code": "K5"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Wie definiert DIN IEC 60050-351 die Ablaufsteuerung?", "a": "Als eine Steuerung mit schrittweisem Ablauf, bei der der Übergang von einem Schritt auf den folgenden programmgemäß entsprechend den vorgegebenen Übergangsbedingungen — Weiterschaltbedingungen, Transitionen — erfolgt.", "star": true, "src": "", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Nenne die zwei Merkmale einer Ablaufsteuerung.", "a": "Es ist immer nur ein Schritt aktiv. Und die Transition erfolgt, wenn die Weiterschaltbedingung erfüllt ist — dann <strong>muss</strong> weitergeschaltet werden.", "star": true, "src": "Kap. 6/10", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "In welche vier Teile gliedert sich eine Ablaufsteuerung?", "a": "Ablaufkette, Betriebsarten, Meldungen und Befehlsausgabe.", "star": false, "src": "Kap. 6/5", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Nenne die Betriebsarten und was sie bedeuten.", "a": "Automatik — Ablauf programmgemäß ohne Bedienereingriff. Hand — der Bediener greift direkt auf den Ausgang durch. Einrichten — Stellgeräte einzeln, unter Umgehung vorhandener Verriegelungen. Tippbetrieb/Einzelschritt — Weiterschaltung durch Bedieneingriff.", "star": false, "src": "Kap. 6/6", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Welche zwei Strukturelemente hat ein Ablaufplan?", "a": "Zustände beziehungsweise Schritte mit den dazugehörigen Aktionen, und Transitionen.", "star": true, "src": "Kap. 6/13", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Welche drei Aktionsarten gibt es?", "a": "Kontinuierlich wirkend; kontinuierlich wirkend, aber von einer Bedingung abhängig; und zeitgesteuert.", "star": false, "src": "Kap. 6/14", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Was ist eine Transition, formal betrachtet?", "a": "Ein boolescher Ausdruck mit dem Ergebnis 0 oder 1 beziehungsweise FALSE oder TRUE. UND wird als <code>a UND b</code> oder <code>a * b</code> geschrieben, ODER als <code>a ODER b</code> oder <code>a + b</code>.", "star": false, "src": "Kap. 6/13", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Was ist eine Wirkverbindung?", "a": "Die Linie, die Schritte miteinander verbindet und den Ablauf der Kette darstellt.", "star": false, "src": "Kap. 6/13", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Was unterscheidet Zuweisung und Zuordnung im Wirkungsteil?", "a": "Die Zuweisung schaltet einen Ausgang, etwa „Motor EIN\". Die Zuordnung setzt einen Wert, etwa „Zähler := 7\".", "star": false, "src": "Kap. 6/13", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Womit beginnt und endet eine Ablaufkette?", "a": "Sie beginnt mit einem Anfangsschritt (initial step), der die Anlage in Grundstellung bringt. Nach Beendigung geht die Kette in die Grundstellung zurück.", "star": false, "src": "", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Welche Regel gilt am Anfang einer ODER-Verzweigung?", "a": "Es darf nur <strong>eine</strong> Weiterschaltbedingung wahr sein, sonst muss eine Priorität vorgegeben werden. Ein Stern zeigt an, dass von links nach rechts abgearbeitet wird — der linke Strang hat dann höhere Priorität.", "star": true, "src": "", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Welche Entwurfsfalle lauert bei der ODER-Verzweigung?", "a": "Es darf nicht eine Bedingung immer sofort erfüllt sein, sonst besteht keine Chance, je eine Alternative zu wählen.", "star": false, "src": "", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Welche Regel gilt für die UND-Verzweigung?", "a": "Nach DIN IEC 60050-351 werden durch <strong>eine</strong> Weiterschaltbedingung alle parallelen Zweige aktiviert und nur durch Erfüllung einer <strong>gemeinsamen</strong> Weiterschaltbedingung wieder zusammengeführt.", "star": true, "src": "", "code": "K6"}, {"kap": "Kapitel 6 — Ablaufsteuerung / SFC", "q": "Welche Normen regeln die Darstellung von Ablaufketten?", "a": "IEC 61131-3 und DIN EN 60848 (GRAFCET). Herstellerwerkzeuge: S7-GRAPH bei Siemens, SFC in Codesys.", "star": false, "src": "", "code": "K6"}, {"kap": "Kapitel 7 — Automaten", "q": "Wie sind Schaltwerke definiert?", "a": "Schaltwerke sind universelle Beschreibungen für zeit- und wertdiskrete Systeme. Diese werden <strong>endliche Automaten</strong> genannt, englisch finite state machine.", "star": true, "src": "Kap. 7/6", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "In welche Bestandteile lässt sich jedes Schaltwerk zerlegen?", "a": "In zwei Schaltnetze plus Zustandsregister (Speicherwerk aus Flipflops). Schaltnetz 1 ist die <strong>Übergangsfunktion</strong> und berechnet den Folgezustand, Schaltnetz 2 ist die <strong>Ausgangsfunktion</strong> und berechnet den Ausgang.", "star": true, "src": "Kap. 7/6", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Wodurch ist ein endlicher Automat definiert?", "a": "Durch eine endliche Menge von Eingabesymbolen x_i ∈ X (Alphabet), eine endliche Menge von Zuständen z_i ∈ Z, einen Anfangszustand z₀ ∈ Z und eine Zustandsübergangsfunktion δ: Z × X → Z. Zusätzlich kann er eine endliche Menge von Ausgabesymbolen y_i ∈ Y und eine Ausgabefunktion λ: Z × X → Y umfassen.", "star": true, "src": "Kap. 7/7", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Wie lautet das 6-Tupel eines Automaten?", "a": "<code>A = (X, Z, z₀, Y, δ, λ)</code> — Eingabealphabet, Zustandsmenge, Anfangszustand, Ausgabealphabet, Übergangsfunktion, Ausgabefunktion.", "star": true, "src": "Kap. 7/7", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Beschreibe das Trivialbeispiel Türsystem.", "a": "Die Tür soll aufgehen, wenn Taster S1 gedrückt wird (x₁ = 1), und zugehen, wenn Taster S2 gedrückt wird (x₂ = 1). Ansonsten verbleibt die Tür in ihrem Zustand. Zwei Zustände: z₁ „Tür zu\" (Anfangszustand) und z₂ „Tür auf\". Ausgänge: y₁ = 1 „öffnet\", y₂ = 1 „schliesst\".", "star": false, "src": "Kap. 7/11", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Beschreibe den Warenautomaten als Automat.", "a": "Er liefert gegen ein 2-€-Stück oder zwei 1-€-Stücke eine Ware. Der Rückgabeknopf gibt eingeworfenes Geld zurück, sofern 2 € noch nicht erreicht sind. Eingabealphabet X = {1, 2, r} mit r für Rückgabe. Ausgabealphabet Y = {w, n, 1, 2} mit w für Ware und n für Nichts. Zustandsmenge Z = {z₁, z₂}, wobei z₀ der neutrale Anfangs- und zugleich Endzustand ist.", "star": true, "src": "Kap. 7/12", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Aus welchen drei Blöcken besteht das Schaltwerk der Ampelschaltung?", "a": "Ausgabefunktion (liefert y₀, y₁, y₂ an die drei Lampen), Übergangsfunktion (verarbeitet die Eingabe x₀ vom Ampelknopf und die Zustände q₀, q₁) und Zustandsspeicher aus zwei D-Flipflops, die q₀ und q₁ halten.", "star": true, "src": "Kap. 7/27", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Nenne die drei Automatentypen und ihre Ausgabefunktion.", "a": "Mealy-Automat: die Ausgabefunktion λ hängt vom aktuellen Zustand <strong>und der Eingabe</strong> ab. Moore-Automat: die Ausgabefunktion μ hängt <strong>nur vom aktuellen Zustand</strong> ab. Medwedjew-Automat: <strong>keine</strong> Ausgabefunktion, die Ausgabe <strong>ist</strong> der aktuelle Zustand.", "star": true, "src": "Kap. 7/8", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Wie ist ein Mealy-Automat formal definiert?", "a": "A = (X, Z, z₀, Y, δ, λ) mit Eingabemenge X, Zustandsmenge Z, Anfangszustand z₀, Ausgabemenge Y, Übergangsfunktion δ und Ausgabefunktion λ.", "star": true, "src": "Kap. 7/8", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Welcher Automatentyp kommt mit den wenigsten Zuständen aus?", "a": "Der Mealy-Automat. Alle drei Typen sind ineinander transferierbar, aber Mealy braucht die wenigsten Zustände — weil die Ausgabe zusätzlich von der Eingabe abhängen darf und deshalb weniger Zustände zur Unterscheidung nötig sind.", "star": true, "src": "Kap. 7/8", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Woran erkennt man im Zustandsgraphen, ob Moore oder Mealy vorliegt?", "a": "Steht die Ausgabe <strong>im Zustandskreis</strong>, ist es ein Moore-Automat. Steht sie <strong>an der Kante</strong> in der Form <code>Eingang / Ausgabe</code>, ist es ein Mealy-Automat.", "star": true, "src": "", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Formuliere die Musterbegründung für einen Moore-Automaten.", "a": "„Es handelt sich um einen Moore-Automaten, weil die Ausgabefunktion y nur vom aktuellen Zustand abhängig ist.\"", "star": true, "src": "Übung 7", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Wie wandelt man Mealy in Moore um?", "a": "Jeden Zustand für jede dort auftretende Ausgabe aufspalten und die Ausgabe in den Zustand schreiben. Die Zustandszahl steigt.", "star": true, "src": "Kap. 7/8", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Wie wandelt man Moore in Mealy um?", "a": "Die Ausgabe eines Zustands an alle <strong>eingehenden</strong> Kanten schreiben. Die Zustandszahl bleibt gleich oder sinkt.", "star": true, "src": "Kap. 7/8", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Was ist der Unterschied zwischen Akzeptor und Transduktor?", "a": "Der Akzeptor prüft, ob eine Eingabefolge zu einer Sprache gehört, und kennt akzeptierende Endzustände — die Ausgabe ist im Kern ja/nein. Der Transduktor erzeugt zu jeder Eingabe eine Ausgabe, wandelt also Eingabefolgen in Ausgabefolgen um.", "star": false, "src": "Kap. 7/18", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Wie viele Zeilen hat die Folgezustandstabelle?", "a": "2 hoch (Anzahl Zustandsbits + Anzahl Eingangsbits). Bei zwei Zustandsbits und zwei Eingängen also 2⁴ = 16 Zeilen.", "star": true, "src": "", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Welche Spalten hat die Folgezustandstabelle?", "a": "Aktueller Zustand, Eingang, Folgezustand und Ausgabe.", "star": true, "src": "", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Wie kommt man vom Zustandsgraphen zur Schaltung?", "a": "Erstens Automatentyp bestimmen. Zweitens Folgezustandstabelle aufstellen. Drittens je ein KV-Diagramm für jedes Zustandsbit z(n+1) und eines für die Ausgangsvariable, daraus die minimale DNF. Viertens Schaltplan zeichnen: je Zustandsbit ein D-Flipflop, davor das Gatternetz aus NOT, AND und OR.", "star": true, "src": "Übung 7", "code": "K7"}, {"kap": "Kapitel 7 — Automaten", "q": "Wie behandelt man eine unzulässige Eingangskombination?", "a": "Als Don't-Care in den KV-Diagrammen. Soll der Automat bei unzulässiger Eingabe im aktuellen Zustand bleiben, ergänzt man die Gleichungen so, dass z(n+1) = z(n) für diese Kombination gilt.", "star": true, "src": "Übung 7", "code": "K7"}];</script>
<script>
const $=s=>document.querySelector(s);
const cards=window.KARTEN;
let filter='alle', kapFilter='', order=[], pos=0, flipped=false;
const seen=new Set(), known=new Set();

function pool(){
  return cards.map((c,i)=>i).filter(i=>{
    const c=cards[i];
    if(filter==='klausur'&&!c.star) return false;
    if(filter==='offen'&&known.has(i)) return false;
    if(kapFilter&&c.kap!==kapFilter) return false;
    return true;
  });
}
function rebuild(keep){
  const cur=order[pos];
  order=pool();
  if(keep&&order.includes(cur)) pos=order.indexOf(cur);
  else pos=0;
  render();
}
function shuffle(){
  for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;
    [order[i],order[j]]=[order[j],order[i]];}
  pos=0;render();
}
function step(d){
  if(!order.length) return;
  pos=(pos+d+order.length)%order.length;
  flipped=false;render();
}
function flip(){ if(order.length){flipped=!flipped;paint();} }

function rate(ok){
  const i=order[pos];
  if(i===undefined) return;
  seen.add(i);
  if(ok) known.add(i); else known.delete(i);
  if(filter==='offen'&&ok){rebuild(false);return;}
  step(1);
}

function paint(){
  $('#card').classList.toggle('flip',flipped);
  $('#card').setAttribute('aria-label',
    flipped?'Antwort. Zum Umdrehen aktivieren.':'Frage. Zum Umdrehen aktivieren.');
}

function render(){
  const total=order.length;
  $('#stage').hidden=!total;
  $('#empty').hidden=!!total;
  $('#rate').hidden=!total;
  if(!total){$('#bar-i').style.width='0%';paintStats();return;}
  const c=cards[order[pos]];
  $('#q').innerHTML=c.q;
  $('#a').innerHTML=c.a;
  for(const side of ['f','b']){
    $('#kap-'+side).innerHTML='<b>'+c.code+'</b>';
    $('#src-'+side).textContent=c.src||'Foliensatz';
    $('#nr-'+side).textContent=(pos+1)+' / '+total;
  }
  $('#klausur-f').hidden=!c.star;
  $('#klausur-b').hidden=!c.star;
  $('#bar-i').style.width=(total?((pos+1)/total*100):0)+'%';
  paint();paintStats();
}
function paintStats(){
  $('#s-known').textContent=known.size;
  $('#s-total').textContent=cards.length;
  $('#s-star').textContent=cards.filter((c,i)=>c.star&&known.has(i)).length
    +' / '+cards.filter(c=>c.star).length;
}

addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='j')rate(true);
  if(e.key==='n')rate(false);
});

let x0=null;
$('#stage').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
$('#stage').addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0;
  if(Math.abs(dx)>55){step(dx<0?1:-1);}
  x0=null;
},{passive:true});

document.querySelectorAll('.seg button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.seg button').forEach(o=>o.setAttribute('aria-pressed',o===b));
    filter=b.dataset.f;flipped=false;rebuild(false);
  };
});
$('#kap').onchange=e=>{kapFilter=e.target.value;flipped=false;rebuild(false);};
$('#shuffle').onclick=shuffle;
$('#card').onclick=flip;
$('#ok').onclick=()=>rate(true);
$('#again').onclick=()=>rate(false);

rebuild(false);
</script>
